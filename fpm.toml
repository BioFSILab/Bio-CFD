name = "Bio-CFD"
dependencies.hdf5 = "*"
version = "0.1.0"
[build]
auto-executables = true
auto-tests = true
auto-examples = true
external-modules = ["hdf5"]
link = ["hdf5", "hdf5_fortran"]

[preprocess]
cpp.suffixes = ["f90"]
cpp.macros = ["USE_HDF5=0"]

[install]
library = false

[dev-dependencies]
test-drive.git = "https://github.com/fortran-lang/test-drive"
test-drive.tag = "v0.4.0"

[extra.fortitude.check]
select = ["ALL"]
# C003: implicit-external-procedures
# This is an F2018 and not supported by nvfortran
ignore = ["C003"]
