name: Setup Fortran

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main,dev]
#  push:
#    branches: [main]


permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.toolchain.compiler }}${{ matrix.toolchain.tag }}-hdf5-${{ matrix.toolchain.hdf5 }}
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    env:
      FPM_FFLAGS: ${{ matrix.toolchain.FPM_FFLAGS }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        toolchain:
          # Compile with OpenACC and OpenMP as the default
          - compiler: gcc
            version: 14
            FPM_FFLAGS: "-Werror=unused -Werror=unused-parameter --coverage -pedantic-errors -std=f2008 -fopenmp -fopenacc"
            hdf5: Off
          - compiler: gcc
            version: 14
            FPM_FFLAGS: "-Werror=unused -Werror=unused-parameter --coverage -pedantic-errors -std=f2008 -fopenmp -fopenacc"
            hdf5: On
          # As far as we can remember we haven't hit any issues picked
          # up by intel but not by the other compilers, while minutes
          # are limited we will not run these
          # - {compiler: intel, version: '2025.0'}
          # - {compiler: intel-classic, version: '2021.10'}

          # Separate nvidia compilations removed because using up all
          # our CI minutes!  The code now supports OpenMP+OpenACC
          # anyway, so it makes sense to just compile once
          - {compiler: nvidia-hpc, version: '25.1', FPM_FFLAGS: "-mp -acc=multicore", hdf5: Off }
          # Cannot currently support lfortran due to it not supporting
          # namelists (issue number 1999 lfortran)
          # - {compiler: lfortran, version: '0.55.0'}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          # Frees up space, so can install nvhpc.
          # See https://github.com/orgs/community/discussions/25678 for
          # where suggestion came from
          rm -rf /opt/hostedtoolcache
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - uses: fortran-lang/setup-fpm@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          # Install hdf5 dependency
          sudo apt install libhdf5-dev

      - name: Modify fpm.toml to switch on HDF5
        if: ${{ contains(matrix.toolchain.hdf5, 'On') }}
        run: |
          sed -i 's/# dependencies.hdf5/dependencies.hdf5/' fpm.toml
          sed -i 's/"USE_HDF5=0"/"USE_HDF5=1"/' fpm.toml
          # Just use single thread for tests when using HDF5
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Modify FPM_FFLAGS to include mpi flags nvhpc
        if: ${{ contains(matrix.toolchain.compiler, 'nvidia-hpc') }}
        run: |
          export MPI_FLAGS=$(mpif90 -show | cut -d' ' -f2-)
          export FPM_FFLAGS="$MPI_FLAGS $FPM_FFLAGS"
          echo "FPM_FFLAGS=$FPM_FFLAGS" >> $GITHUB_ENV
          sed -i 's/"USE_HDF5=0"/"USE_HDF5=0","BIOCFD_MPI"/' fpm.toml

      - run: |
          # Build and test code using FPM
          fpm test

      - name: Generate code coverage report
        if: ${{ contains(matrix.toolchain.FPM_FFLAGS, 'coverage') }}
        run: |
          gcov ./build/gfortran*/Bio-CFD/*.gcda -r

      - name: Setup LCOV
        if: ${{ contains(matrix.toolchain.FPM_FFLAGS, 'coverage') }}
        uses: hrishikesh-kadam/setup-lcov@v1

      - name: Remove folders from coverage report
        if: ${{ contains(matrix.toolchain.FPM_FFLAGS, 'coverage') }}
        run: |
          lcov --directory . --capture --output-file coverage.info --gcov-tool gcov
          lcov --remove coverage.info "$PWD/test/*" --output-file coverage.info
          lcov --remove coverage.info "$PWD/build/*" --output-file coverage.info

      - name: Report code coverage as comment
        if: ${{ contains(matrix.toolchain.FPM_FFLAGS, 'coverage') }}
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: coverage.info
          minimum-coverage: 0
          artifact-name: code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src
          update-comment: true
